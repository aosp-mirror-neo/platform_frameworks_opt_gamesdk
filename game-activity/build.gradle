plugins {
    id 'com.android.library'
    id 'jacoco'
}

buildDir = "../../out_game_activity"

apply from: '../ndk_version.gradle'
apply from: '../coverage.gradle'
apply from: '../robolectric.gradle'

android {
    namespace "com.google.androidgamesdk.gameactivity"
    compileSdk 35
    ndkVersion agdkNdkVersion

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        externalNativeBuild {
            cmake {
                def cmakeArgs = []
                if (project.hasProperty("stl")) {
                    cmakeArgs << ('-DANDROID_STL='+ project.stl)
                } else {
                    cmakeArgs << ('-DANDROID_STL=c++_shared')
                }
                arguments(*cmakeArgs)
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            testCoverageEnabled true
            externalNativeBuild {
                cmake {
                    arguments "-DBUILD_ANDROID_TESTS=ON"
                }
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                jacoco {
                    includeNoLocationClasses = true
                    excludes = ['jdk.internal.*']
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.18.0+"
        }
    }
    buildFeatures {
        prefabPublishing true
    }
    prefab {
        gameactivity {
            name "game-activity"
            headers "prefab-src/modules/game-activity/include/"
        }
        gameactivity_static {
            name "game-activity_static"
            headers "prefab-src/modules/game-activity/include/"
        }
    }

    sourceSets {
        androidTest {
            jniLibs.srcDirs = ['libs']
            jni.srcDirs = ['src/androidTest/jni']
        }
    }

    // If we don't include this line the created .aar contains the c++ std lib
    // at <.aar_file>/jni/<abi>/libc++_shared.so. When we have multiple
    // libraries containing libc++_shared.so the linker complains because it
    // can't choose between them. Because we use prefab we don't need to
    // contents of the <.aar_file>/jni/* folder so we can just exclude it here
    // to prevent the jni folder from being created.
    packagingOptions {
        exclude("jni/**/libc++_shared.so")
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.core:core:1.5.0'
    implementation 'com.google.android.material:material:1.2.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.2.0'
    testImplementation 'org.robolectric:robolectric:4.13'

    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

repositories {
    google()
    mavenCentral()
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    reports {
        xml.required = true
        html.required = true
    }
    sourceDirectories.setFrom(files('src/main/java'))
    classDirectories.setFrom(fileTree(
        dir: "$buildDir/intermediates/javac/debug/compileDebugJavaWithJavac/classes",
        excludes: ['**/R.class', '**/R$*.class', '**/BuildConfig.*']
    ))
    executionData.setFrom(fileTree(
        dir: buildDir,
        includes: [
            'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec',
            'jacoco/testDebugUnitTest.exec',
        ]
    ))
}
